<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/img/4geeks.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Generator</title>

    <!-- Fontawesome is our recomended library for icons -->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
      integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Write your HTML code here, you can delete everything withing the body tags -->

    <!--Card-->
    <div
      class="container-fluid d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="container-fluid text-center">
        <h1>Do You Want A Card?</h1>
        <button class="btn btn-primary mt-1 mb-4" id="cardButton">
          Generate Card
        </button>
        <div class="card shadow-lg bg-light mx-auto" style="width: 22rem; height: 30rem">
          <div class="card-body position-relative">
            <!--Top Card-->
            <div class="row">
              <div class="col-2 fs-1" id="cardTop">♥︎</div>
              <div class="col-12>"></div>
            </div>
            <!--Middle Card-->
            <div class="row h-75 align-items-center justify-content-center">
              <div class="col-12 text-center display-1" id="cardValue">#</div>
            </div>
            <!--Bottom Card-->
            <div class="row">
              <div class="col-10"></div>
              <div class="col-2 fs-1 text-end" id="cardBottom">♥︎</div>
            </div>
          </div>
        </div>

        <div class="fixed-bottom p-4">
          Made with ❤️ by
          <a
            href="https://www.linkedin.com/in/erickdelosreyes/"
            target="blank"
            id="linkName"
            >Erick de los Reyes</a
          >
        </div>
      </div>
    </div>
    <!-- Do not delete this script tag, this is what connects your HTML with the Javascript code -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
